# fly.toml — deploy: fly launch && fly deploy
# Docs: https://fly.io/docs/js/shopify/

app = "profit-brain-ai"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  SCOPES = "read_products,read_orders,read_customers,read_checkouts,write_products,read_inventory"
  SHOPIFY_BILLING_TEST = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "profit_brain_data"
  destination = "/data"
